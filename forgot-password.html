
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYND Marketplace</title>
    <link rel="icon" type="image/jpeg" href="image/logo2.0.jpg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 27px;
        }

        .description {
            margin-bottom: 25px;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #202b38;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #202b38;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <h1>Reset Password</h1>

        <p class="description">
            Follow the steps below to reset your FYND Marketplace password.
        </p>

        <section id="email-step" class="step active">
            <form id="email-form">
                <label for="email">Registered email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="name@gmail.com"
                    autocomplete="email"
                    required
                >

                <button type="submit" id="send-button">
                    Send Verification Code
                </button>
            </form>
        </section>

        <section id="code-step" class="step">
            <form id="code-form">
                <label for="code">6-digit verification code</label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    placeholder="Enter your code"
                    autocomplete="one-time-code"
                    required
                >

                <button type="submit" id="verify-button">
                    Verify Code
                </button>

                <button type="button" id="resend-button">
                    Request New Code
                </button>
            </form>
        </section>

        <section id="password-step" class="step">
            <form id="password-form">
                <label for="password">New password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    required
                >

                <label for="confirm-password">Confirm new password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Re-enter your password"
                    required
                >

                <button type="submit" id="reset-button">
                    Reset Password
                </button>
            </form>
        </section>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <a class="back-link" href="signin.html">Back to Login</a>
    </main>

    <script>
        const message = document.getElementById("message");
        const emailInput = document.getElementById("email");

        let codeRequested = false;
        let resendTimer = null;

        function showStep(stepId) {
            document.querySelectorAll(".step").forEach(function (step) {
                step.classList.remove("active");
            });

            document.getElementById(stepId).classList.add("active");
        }

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.style.color = isError ? "#b42318" : "#16713b";
        }

        async function sendRequest(action, data) {
            const formData = new FormData();

            formData.append("action", action);

            Object.entries(data).forEach(function ([key, value]) {
                formData.append(key, value);
            });

            const response = await fetch("forgot-password.php", {
                method: "POST",
                body: formData,
                credentials: "same-origin"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Request failed.");
            }

            return result;
        }

        function startResendCooldown() {
            const button = document.getElementById("resend-button");
            let remaining = 60;

            button.disabled = true;
            button.textContent = "Request New Code (" + remaining + "s)";

            if (resendTimer) {
                clearInterval(resendTimer);
            }

            resendTimer = setInterval(function () {
                remaining--;

                if (remaining <= 0) {
                    clearInterval(resendTimer);
                    resendTimer = null;
                    button.disabled = false;
                    button.textContent = "Request New Code";
                    return;
                }

                button.textContent =
                    "Request New Code (" + remaining + "s)";
            }, 1000);
        }

        async function requestCode() {
            const result = await sendRequest("send_code", {
                email: emailInput.value.trim()
            });

            if (!result.success) {
                showMessage(result.message, true);
                return false;
            }

            codeRequested = true;
            showStep("code-step");
            showMessage(result.message + " Check your inbox.");
            startResendCooldown();

            return true;
        }

        document.getElementById("email-form").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const button = document.getElementById("send-button");
                button.disabled = true;
                showMessage("Sending request...");

                try {
                    await requestCode();
                } catch (error) {
                    showMessage(error.message, true);
                } finally {
                    button.disabled = false;
                }
            }
        );

        document.getElementById("resend-button").addEventListener(
            "click",
            async function () {
                const button = this;
                button.disabled = true;
                showMessage("Requesting a new code...");

                try {
                    await requestCode();
                } catch (error) {
                    showMessage(error.message, true);
                    button.disabled = false;
                }
            }
        );

        document.getElementById("code-form").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const button = document.getElementById("verify-button");
                button.disabled = true;
                showMessage("Verifying code...");

                try {
                    const result = await sendRequest("verify_code", {
                        code: document.getElementById("code").value.trim()
                    });

                    if (!result.success) {
                        showMessage(result.message, true);
                        return;
                    }

                    showStep("password-step");
                    showMessage(result.message);
                } catch (error) {
                    showMessage(error.message, true);
                } finally {
                    button.disabled = false;
                }
            }
        );

        document.getElementById("password-form").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const password = document.getElementById("password").value;
                const confirmPassword =
                    document.getElementById("confirm-password").value;

                if (password.length < 8) {
                    showMessage(
                        "Your password must be at least 8 characters long.",
                        true
                    );
                    return;
                }

                if (password !== confirmPassword) {
                    showMessage("The passwords do not match.", true);
                    return;
                }

                const button = document.getElementById("reset-button");
                button.disabled = true;
                showMessage("Updating password...");

                try {
                    const result = await sendRequest("reset_password", {
                        password: password,
                        confirm_password: confirmPassword
                    });

                    if (!result.success) {
                        showMessage(result.message, true);
                        return;
                    }

                    document.getElementById("password-form").reset();
                    showMessage(result.message);
                    button.textContent = "Password Updated";

                    setTimeout(function () {
                        window.location.href = "signin.html";
                    }, 2000);
                } catch (error) {
                    showMessage(error.message, true);
                } finally {
                    button.disabled = false;
                }
            }
        );
    </script>
</body>
</html>
