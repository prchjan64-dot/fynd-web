<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYND Marketplace</title>
    <link rel="stylesheet" href="CSS/create-account.css">
     <link rel="icon" type="image/jpeg" href="image/logo2.0.jpg">
</head>
<body>

    <main class="page-container">
        <section class="account-card" aria-labelledby="page-title">

            <div class="brand">
                <img src="image/logo2.0.jpg" alt="FYND Logo" class="brand-logo">
                <h1 id="page-title">Step Into FYND</h1>
            </div>

            <div class="account-section">
                <h2 class="section-label">Create Account</h2>
                <p class="section-sub">Join FYND and start exploring.</p>

                <form class="signin-form" id="signup-form" novalidate>

                    <!-- Full Name -->
                    <div class="field-group">
                        <label class="field-label" for="fullname">Full Name</label>
                        <div class="field-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4 21a8 8 0 0 1 16 0"></path>
                            </svg>
                            <input
                                id="fullname"
                                class="field-input"
                                type="text"
                                name="fullname"
                                placeholder="e.g, Reina Gail Athea Padayao"
                                autocomplete="name"
                                aria-describedby="fullname-error"
                                aria-required="true"
                                required
                            >
                        </div>
                        <p class="field-error" id="fullname-error" role="alert"></p>
                    </div>

                    <!-- Email -->
                    <div class="field-group">
                        <label class="field-label" for="email">Email</label>
                        <div class="field-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                                <path d="m2 7 10 7 10-7"></path>
                            </svg>
                            <input
                                id="email"
                                class="field-input"
                                type="email"
                                name="email"
                                placeholder="e.g, Reina04@gmail.com"
                                autocomplete="email"
                                inputmode="email"
                                aria-describedby="email-error"
                                aria-required="true"
                                required
                            >
                        </div>
                        <p class="field-error" id="email-error" role="alert"></p>
                    </div>

                    <!-- Password -->
                    <div class="field-group">
                        <label class="field-label" for="password">Password</label>
                        <div class="field-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input
                                id="password"
                                class="field-input"
                                type="password"
                                name="password"
                                placeholder="Create a Password"
                                autocomplete="new-password"
                                aria-describedby="password-error"
                                aria-required="true"
                                required
                            >
                            <button
                                class="field-toggle"
                                type="button"
                                aria-label="Show password"
                                aria-pressed="false"
                                data-toggle-password="password"
                            >
                                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <p class="field-error" id="password-error" role="alert"></p>
                    </div>

                    <!-- Confirm Password -->
                    <div class="field-group">
                        <label class="field-label" for="confirm-password">Confirm Password</label>
                        <div class="field-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input
                                id="confirm-password"
                                class="field-input"
                                type="password"
                                name="confirm-password"
                                placeholder="Re-enter your password"
                                autocomplete="new-password"
                                aria-describedby="confirm-password-error"
                                aria-required="true"
                                required
                            >
                            <button
                                class="field-toggle"
                                type="button"
                                aria-label="Show password"
                                aria-pressed="false"
                                data-toggle-password="confirm-password"
                            >
                                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <p class="field-error" id="confirm-password-error" role="alert"></p>
                    </div>

                    <!-- Phone Number -->
                    <div class="field-group">
                        <label class="field-label" for="phone">Phone Number</label>
                        <div class="field-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path>
                            </svg>
                            <input
                                id="phone"
                                class="field-input"
                                type="tel"
                                name="phone"
                                placeholder="e.g, 09XXX XXX XXXX"
                                autocomplete="tel"
                                inputmode="tel"
                                maxlength="16"
                                aria-describedby="phone-error"
                                aria-required="true"
                                required
                            >
                        </div>
                        <p class="field-error" id="phone-error" role="alert"></p>
                    </div>

                    <!-- Server-side error message -->
                    <p class="field-error" id="form-error" role="alert" style="text-align:center;"></p>

                    <button class="signin-submit" type="submit">Create Account</button>

                    <p class="signin-create">
                        Already have an account?
                        <a href="signin.html">Log in</a>
                    </p>

                </form>
            </div>

        </section>
    </main>

    <script>
        /* ---------- Pre-fill email coming from the "Join us" box ---------- */
        (function () {
            var params = new URLSearchParams(window.location.search);
            var prefill = params.get("email");
            if (prefill) {
                document.getElementById("email").value = prefill;
                document.getElementById("fullname").focus();
            }
        })();

        /* ---------- Show / hide password ---------- */
        document.querySelectorAll("[data-toggle-password]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                var input = document.getElementById(btn.dataset.togglePassword);
                var isShowing = input.type === "text";
                input.type = isShowing ? "password" : "text";
                btn.setAttribute("aria-label", isShowing ? "Show password" : "Hide password");
                btn.setAttribute("aria-pressed", String(!isShowing));
            });
        });

        /* ---------- Validation ---------- */
        var form = document.getElementById("signup-form");
        var fields = {
            fullname: document.getElementById("fullname"),
            email:    document.getElementById("email"),
            password: document.getElementById("password"),
            confirm:  document.getElementById("confirm-password"),
            phone:    document.getElementById("phone")
        };

        /* Marks a field valid/invalid.
           - invalid + message  -> red border AND text under the field
           - invalid + no text  -> red border only (used for empty required fields) */
        function setState(input, invalid, message) {
            var errorEl = document.getElementById(input.id + "-error");
            if (errorEl) errorEl.textContent = invalid ? (message || "") : "";
            input.classList.toggle("is-invalid", invalid);
            input.setAttribute("aria-invalid", invalid ? "true" : "false");
            return !invalid;
        }

        var validators = {
            fullname: function () {
                var v = fields.fullname.value.trim();
                if (v === "")     return setState(fields.fullname, true);   // required: red border only
                if (v.length < 2) return setState(fields.fullname, true, "Full name is too short.");
                return setState(fields.fullname, false);
            },
            email: function () {
                var v = fields.email.value.trim();
                if (v === "") return setState(fields.email, true);          // required: red border only
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))
                    return setState(fields.email, true, "Please enter a valid email address.");
                return setState(fields.email, false);
            },
            password: function () {
                var v = fields.password.value;
                if (v === "")     return setState(fields.password, true);   // required: red border only
                if (v.length < 8) return setState(fields.password, true, "Password must be at least 8 characters.");
                return setState(fields.password, false);
            },
            confirm: function () {
                var v = fields.confirm.value;
                if (v === "") return setState(fields.confirm, true);        // required: red border only
                if (v !== fields.password.value) return setState(fields.confirm, true, "Passwords do not match.");
                return setState(fields.confirm, false);
            },
            phone: function () {
                var v = fields.phone.value.replace(/[\s-]/g, "");
                if (v === "") return setState(fields.phone, true);          // required: red border only
                if (!/^(09\d{9}|\+639\d{9})$/.test(v))
                    return setState(fields.phone, true, "Enter a valid number, e.g. 09XXX XXX XXXX.");
                return setState(fields.phone, false);
            }
        };

        /* Re-validate on input if already invalid, so the red clears as soon as it's fixed */
        Object.keys(fields).forEach(function (key) {
            fields[key].addEventListener("blur", function () {
                /* Only flag an empty field after submit, not just from tabbing through it */
                if (fields[key].value.trim() !== "") validators[key]();
            });
            fields[key].addEventListener("input", function () {
                if (fields[key].classList.contains("is-invalid")) validators[key]();
                if (key === "password" && fields.confirm.value !== "") validators.confirm();
            });
        });

        /* ---------- Submit → register.php ---------- */
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            var allValid = true;
            var firstInvalid = null;
            Object.keys(validators).forEach(function (key) {
                if (!validators[key]()) {
                    allValid = false;
                    if (!firstInvalid) firstInvalid = fields[key];
                }
            });

            if (!allValid) {
                firstInvalid.focus();
                return;
            }

            var btn = form.querySelector(".signin-submit");
            var formError = document.getElementById("form-error");
            btn.disabled = true;
            btn.textContent = "Creating account…";
            formError.textContent = "";

            fetch("register.php", { method: "POST", body: new FormData(form) })
                .then(function (res) { return res.json(); })
                .then(function (json) {
                    if (json.success) {
                        window.location.href = "signin.html";
                    } else {
                        formError.textContent = json.message;
                        btn.disabled = false;
                        btn.textContent = "Create Account";
                    }
                })
                .catch(function () {
                    formError.textContent = "Something went wrong. Please try again.";
                    btn.disabled = false;
                    btn.textContent = "Create Account";
                });
        });
    </script>

</body>
</html>
